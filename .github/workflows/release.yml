# release pipeline: push a tag "v1.2.3" (or run it by hand with a tag name) and github builds the exe, checks it, builds the NSIS installer and
# publishes a release with both files: notepad-mint-<version>.exe (standalone) and notepad-mint-<version>-setup.exe (installer).
#   git tag v1.0.0 && git push origin v1.0.0
# keep the version in step with FILEVERSION / ProductVersion in src/notepad_mint.rc.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "existing tag to build and publish (v1.2.3)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: version
        id: ver
        shell: pwsh
        env:
          REQUESTED_TAG: ${{ github.event.inputs.tag }}
        run: |
          $tag = if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') { $env:REQUESTED_TAG } else { $env:GITHUB_REF_NAME }
          if ($tag -notmatch '^v(\d+\.\d+\.\d+)$') { throw "tag '$tag' is not v<major>.<minor>.<patch>" }
          $version = $Matches[1]
          $tagCommit = git rev-parse "refs/tags/$tag^{commit}"
          if ($LASTEXITCODE -ne 0) { throw "tag '$tag' does not exist" }
          if ($tagCommit -ne (git rev-parse HEAD)) { throw 'checkout does not match the release tag' }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT

      # the tag, the version resource, the about box (mp.h) and the installer must all say the same version
      - name: version strings
        shell: pwsh
        run: ./tools/check_version.ps1 -Expect ${{ steps.ver.outputs.version }}

      # puts the 32-bit msvc toolchain (cl / ml / link / rc) on the path; build.bat then skips its own vcvars lookup
      - name: msvc x86 environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: build (release)
        shell: pwsh
        run: |
          cmd /c build.bat 2>&1 | Tee-Object build-release.log
          if ($LASTEXITCODE -ne 0) { throw 'release build failed' }
          if (Select-String -Path build-release.log -Pattern 'warning [A-Z]+[0-9]+') { throw 'release build has warnings' }
          if ((Get-Item build/notepad-mint.exe).Length -ge 300000) { throw 'executable exceeds size limit' }

      - name: win32 sdk layout
        shell: cmd
        run: tools\layout_check\check.bat

      # the project promises an exe that links kernel32 / user32 / gdi32 only
      - name: imports
        shell: pwsh
        run: ./tools/check_imports.ps1

      - name: unit tests
        shell: cmd
        run: tests\unit\build.bat

      - name: print tests
        shell: cmd
        run: tests\print\build.bat

      - name: nsis
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) { choco install nsis -y --no-progress }
          $nsis = "${env:ProgramFiles(x86)}\NSIS"
          if (Test-Path $nsis) { $nsis >> $env:GITHUB_PATH }

      - name: installer
        shell: cmd
        run: tools\installer.bat ${{ steps.ver.outputs.version }}

      - name: publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ steps.ver.outputs.tag }}'
          $v = '${{ steps.ver.outputs.version }}'
          $files = @("build/notepad-mint-$v.exe", "build/notepad-mint-$v-setup.exe")
          $sums = foreach ($file in $files) { ((Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()) + '  ' + (Split-Path $file -Leaf) }
          $sums | Set-Content "build/SHA256SUMS.txt" -Encoding ascii
          $files += 'build/SHA256SUMS.txt'
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @files --clobber
          } else {
            gh release create $tag @files --verify-tag --title "notepad mint $v" --notes-file RELEASE_NOTES.md
          }
          if ($LASTEXITCODE -ne 0) { throw "publishing the release failed" }
